[project]
name = "future-trading-bot-rnd"
version = "0.1.0"
description = "Crypto futures screener & trading system"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13.0",
    "httpx>=0.27",
    "pydantic>=2.5",
    "fastapi>=0.140.7",
    "uvicorn[standard]>=0.51.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "features", "market_data"]
